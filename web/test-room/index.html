<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clade — test room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0d10'/><circle cx='8' cy='8' r='4' fill='%233fb950'/></svg>">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d10; color: #e6e8eb;
         font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { max-width: 52rem; margin: 0 auto; padding-block: 1.5rem; padding-inline: 1rem; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .25rem; }
  .note { color: #7d8590; margin: 0 0 1rem; }
  button { font: inherit; background: #21262d; color: #e6e8eb; border: 1px solid #30363d;
           padding: .6rem 1rem; border-radius: 6px; cursor: pointer; margin: 0 .5rem .5rem 0; min-height: 44px; }
  button:disabled { opacity: .45; cursor: default; }
  button.chosen { border-color: #3fb950; color: #3fb950; opacity: 1; }
  #status { margin: .5rem 0 1rem; }
  #interrupted, #notice { border: 1px solid #d29922; color: #d29922; padding: .75rem 1rem; border-radius: 6px; margin: 0 0 1rem; }
  #result { border: 1px solid #3fb950; padding: .75rem 1rem; border-radius: 6px; margin: 1rem 0; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1rem; }
  .dim { color: #7d8590; }
  #log, #theirs { white-space: pre-wrap; color: #adbac7; }
</style>
<main>
  <h1>test room</h1>
  <p class="note">A throwaway room that exercises the server: hidden commits, a server-issued seed, the computer seat, reconnect. Not a game.</p>

  <div id="interrupted" hidden></div>
  <div id="notice" hidden></div>

  <section id="menu">
    <button id="vs-computer">Play the computer</button>
    <button id="vs-person">Play a person</button>
  </section>

  <div id="status" class="dim">idle</div>

  <section id="match" hidden>
    <div>round <span id="round">-</span> · wins <span id="wins">0 – 0</span> · <span id="clock" class="dim"></span></div>
    <div id="opponent" class="dim"></div>
    <div class="cols">
      <div><h1>your options</h1><div id="options"></div></div>
      <div><h1>their options</h1><div id="theirs" class="dim"></div></div>
    </div>
  </section>

  <div id="result" hidden></div>
  <div id="log"></div>
</main>
<script type="module" src="main.js"></script>
