name: core

# The gates on core/, the rules shared by every variant, the server and the
# browser. Workshop issues #23, #24.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 strips TypeScript types natively, so the test runs unbuilt,
      # exactly as the server will run core/.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Bun is JavaScriptCore, the engine family of Safari and of every
      # browser on an iPad.
      - uses: oven-sh/setup-bun@v2

      - name: Golden hashes under V8 (Node 22)
        run: node tests/determinism.test.ts

      - name: Golden hashes under JavaScriptCore (Bun)
        run: bun tests/determinism.test.ts

  core-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No engine-dependent maths, clocks or outside imports in core/
        run: bash tests/core-purity.sh core

      # The gate's own test. It has been wrong twice (workshop #35, #43), both
      # times because nothing exercised it.
      - name: The gate rejects every spelling it is meant to
        run: bash tests/core-purity.test.sh

  # The genome -> anatomy traits mapping (render/traits.ts, workshop #26).
  # Node 22 strips the types, so the test runs unbuilt.
  render-traits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test tests/render-traits.test.ts
        run: node --test tests/render-traits.test.ts

  # The shared audio module (audio/), driven with a counting fake Web Audio
  # context: nothing before a gesture, muted does no work, the voice cap holds.
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test tests/audio.test.ts
        run: node --test tests/audio.test.ts

  # Variant A's rules and computer (server/a/, workshop #59), and the core
  # scorer and divergence they read. Prints the snowball figure to compare
  # with the measured mirror-deal figure; above 75 % fails.
  a-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test tests/a-rules.test.ts
        run: node --test tests/a-rules.test.ts

  # The replay's fight events (ui/fight-events.ts, workshop #60) copy core's
  # strike split outside core/. This keeps the copy equal to core.fight() bit
  # for bit over 9000 random fights.
  fight-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test tests/fight-events.test.ts
        run: node --test tests/fight-events.test.ts

  # The shared presentation (ui/, workshop #61): every fusion record the core
  # can produce gives a real birth sentence, and the counters wording is exact.
  ui-birth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test tests/ui-birth.test.ts
        run: node --test tests/ui-birth.test.ts

  # Variant A's tier 1 client session (web/a/session.ts, workshop #62): a stored
  # match resumes to the same state and screen, and corrupt or edited storage is
  # refused rather than thrown.
  a-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node --test tests/a-client.test.ts
        run: node --test tests/a-client.test.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npx tsc --noEmit

      # render/ and web/ run in the browser: typed against the DOM, and bundled
      # exactly as the Dockerfile's web stage bundles them.
      - name: tsc --noEmit (browser code)
        run: npx tsc --noEmit -p tsconfig.web.json

      - name: Browser bundle builds
        run: npm run build:web
