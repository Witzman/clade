name: hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No assistant attribution in commit messages
        run: |
          # Rule: every commit is authored by witzman alone. This job exists
          # because in the sibling project the rule was prose, was broken 32
          # times, and cost a history rewrite over 46 commits.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
            git rev-parse --quiet --verify "${{ github.event.before }}" >/dev/null || range="HEAD~1..HEAD"
          fi
          bad=$(git log --format='%H %s%n%b' "$range" \
                | grep -inE 'Co-Authored-By:|Generated with .*Claude|claude\.com/claude-code' || true)
          if [ -n "$bad" ]; then
            echo "::error::assistant attribution found in commit messages"
            echo "$bad"
            exit 1
          fi
          echo "clean"

      - name: No internal paths in tracked files
        run: |
          # Corollary: nothing a reader of the published game can see may link
          # to a path they cannot reach.
          bad=$(git grep -nE '~/game/notes|/home/witzman' -- . \
                ':!.github/workflows/hygiene.yml' || true)
          if [ -n "$bad" ]; then
            echo "::error::internal path referenced in a published file"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every asset is credited
        run: |
          # Provenance is an obligation that is easy to intend and easy to
          # skip, and expensive to reverse once published -- this repository
          # distributes what is in it. So the rule gets a door.
          [ -d assets ] || { echo "no assets/ directory yet"; exit 0; }

          missing=0
          while IFS= read -r f; do
            # The credit row must name the file. Matching on the path rather
            # than the basename, so two files with the same name in different
            # directories cannot share one row.
            grep -qF "$f" CREDITS.md || { echo "uncredited: $f"; missing=1; }
          done < <(find assets -type f ! -name '.gitkeep')

          if [ "$missing" -ne 0 ]; then
            echo "::error::asset(s) with no row in CREDITS.md"
            echo "Add: file | source URL | author | licence | changes made"
            exit 1
          fi
          echo "all assets credited"
